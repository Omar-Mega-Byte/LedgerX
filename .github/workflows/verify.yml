name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Check workbench types
        run: npm ci && npm run check:ui
      - name: Validate production Compose configuration
        run: |
          mkdir -p secrets
          : > secrets/grafana-admin-password
          docker compose --env-file .env.example -f compose.production.yaml config --quiet
      - name: Verify
        run: bash ./mvnw --batch-mode verify
      - name: Install Chromium for real identity browser flows
        run: npx playwright install --with-deps chromium
      - name: Test production-profile browser stack
        run: npm run test:e2e
