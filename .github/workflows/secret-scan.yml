name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch all branch, tag, and pull request refs
        run: |
          git fetch --force --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/audit/pull/*/head'
          git fetch --force --no-tags origin '+refs/tags/*:refs/tags/*'

      - name: Install verified Gitleaks release
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          export PATH="$install_dir:$PATH"
          echo "$install_dir" >> "$GITHUB_PATH"
          gitleaks version

      - name: Scan current repository files
        run: |
          report="$RUNNER_TEMP/gitleaks-files.json"
          if gitleaks dir --redact=100 --no-banner --report-format=json --report-path "$report" .; then
            result=0
          else
            result=$?
          fi
          python3 - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              findings = json.load(report_file)
          for finding in findings:
              print("finding: rule={} file={} line={} commit={}".format(
                  finding.get("RuleID", "unknown"),
                  finding.get("File", "unknown"),
                  finding.get("StartLine", "unknown"),
                  finding.get("Commit", "working tree"),
              ))
          PY
          rm -f "$report"
          exit "$result"

      - name: Scan all reachable Git history
        run: |
          report="$RUNNER_TEMP/gitleaks-history.json"
          if gitleaks git --redact=100 --no-banner --report-format=json --report-path "$report" \
            --log-opts="--no-textconv --full-history --all --diff-filter=tuxdb" .; then
            result=0
          else
            result=$?
          fi
          python3 - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              findings = json.load(report_file)
          for finding in findings:
              print("finding: rule={} file={} line={} commit={}".format(
                  finding.get("RuleID", "unknown"),
                  finding.get("File", "unknown"),
                  finding.get("StartLine", "unknown"),
                  finding.get("Commit", "unknown"),
              ))
          PY
          rm -f "$report"
          exit "$result"
