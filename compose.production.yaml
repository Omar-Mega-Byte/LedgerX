services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${LEDGERX_DB_NAME}
      POSTGRES_USER: ${LEDGERX_DB_USERNAME}
      POSTGRES_PASSWORD: ${LEDGERX_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ledgerx-postgres-data:/var/lib/postgresql/data

  keycloak-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

  ledgerx:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LEDGERX_DB_URL: jdbc:postgresql://postgres:5432/${LEDGERX_DB_NAME}
      LEDGERX_DB_USERNAME: ${LEDGERX_DB_USERNAME}
      LEDGERX_DB_PASSWORD: ${LEDGERX_DB_PASSWORD}
      LEDGERX_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGERX_KAFKA_PAYMENT_EVENTS_TOPIC: ${LEDGERX_KAFKA_PAYMENT_EVENTS_TOPIC}
      LEDGERX_KAFKA_CONSUMER_ENABLED: ${LEDGERX_KAFKA_CONSUMER_ENABLED}
      LEDGERX_OUTBOX_PUBLISHER_ENABLED: ${LEDGERX_OUTBOX_PUBLISHER_ENABLED}
      LEDGERX_OIDC_ISSUER_URI: ${LEDGERX_OIDC_ISSUER_URI}
      LEDGERX_OIDC_API_CLIENT_ID: ${LEDGERX_OIDC_API_CLIENT_ID}
      LEDGERX_OUTBOX_POLL_DELAY: ${LEDGERX_OUTBOX_POLL_DELAY}
      LEDGERX_OUTBOX_LEASE_DURATION: ${LEDGERX_OUTBOX_LEASE_DURATION}
      LEDGERX_OUTBOX_PUBLISH_TIMEOUT: ${LEDGERX_OUTBOX_PUBLISH_TIMEOUT}
      LEDGERX_OUTBOX_BATCH_SIZE: ${LEDGERX_OUTBOX_BATCH_SIZE}
      LEDGERX_OUTBOX_RETRY_BASE_DELAY: ${LEDGERX_OUTBOX_RETRY_BASE_DELAY}
      LEDGERX_OUTBOX_RETRY_MAX_DELAY: ${LEDGERX_OUTBOX_RETRY_MAX_DELAY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${KEYCLOAK_PUBLIC_DOMAIN}
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      LEDGERX_PUBLIC_DOMAIN: ${LEDGERX_PUBLIC_DOMAIN}
      KEYCLOAK_PUBLIC_DOMAIN: ${KEYCLOAK_PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      ledgerx:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  keycloak-postgres-data:
  ledgerx-postgres-data:
