services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - events

  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LEDGERX_DB_NAME}
      POSTGRES_USER: ${LEDGERX_DB_USERNAME}
      POSTGRES_PASSWORD: ${LEDGERX_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ledgerx-postgres-data:/var/lib/postgresql/data
    networks:
      - data

  keycloak-postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - identity

  ledgerx:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LEDGERX_DB_URL: jdbc:postgresql://postgres:5432/${LEDGERX_DB_NAME}
      LEDGERX_DB_USERNAME: ${LEDGERX_DB_USERNAME}
      LEDGERX_DB_PASSWORD: ${LEDGERX_DB_PASSWORD}
      LEDGERX_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGERX_KAFKA_PAYMENT_EVENTS_TOPIC: ${LEDGERX_KAFKA_PAYMENT_EVENTS_TOPIC}
      LEDGERX_KAFKA_EVENT_RETENTION: ${LEDGERX_KAFKA_EVENT_RETENTION:-P14D}
      LEDGERX_KAFKA_DEAD_LETTER_RETENTION: ${LEDGERX_KAFKA_DEAD_LETTER_RETENTION:-P30D}
      LEDGERX_KAFKA_CONSUMER_ENABLED: ${LEDGERX_KAFKA_CONSUMER_ENABLED}
      LEDGERX_OUTBOX_PUBLISHER_ENABLED: ${LEDGERX_OUTBOX_PUBLISHER_ENABLED}
      LEDGERX_OIDC_ISSUER_URI: ${LEDGERX_OIDC_ISSUER_URI}
      LEDGERX_OIDC_API_CLIENT_ID: ${LEDGERX_OIDC_API_CLIENT_ID}
      LEDGERX_SECURITY_MUTATION_LIMIT_PER_MINUTE: ${LEDGERX_SECURITY_MUTATION_LIMIT_PER_MINUTE:-120}
      LEDGERX_WEB_CLIENT_ID: ${LEDGERX_WEB_CLIENT_ID:-ledgerx-web}
      LEDGERX_OUTBOX_POLL_DELAY: ${LEDGERX_OUTBOX_POLL_DELAY}
      LEDGERX_OUTBOX_LEASE_DURATION: ${LEDGERX_OUTBOX_LEASE_DURATION}
      LEDGERX_OUTBOX_PUBLISH_TIMEOUT: ${LEDGERX_OUTBOX_PUBLISH_TIMEOUT}
      LEDGERX_OUTBOX_BATCH_SIZE: ${LEDGERX_OUTBOX_BATCH_SIZE}
      LEDGERX_OUTBOX_RETRY_BASE_DELAY: ${LEDGERX_OUTBOX_RETRY_BASE_DELAY}
      LEDGERX_OUTBOX_RETRY_MAX_DELAY: ${LEDGERX_OUTBOX_RETRY_MAX_DELAY}
      LEDGERX_WEBHOOK_CONSUMER_ENABLED: ${LEDGERX_WEBHOOK_CONSUMER_ENABLED:-false}
      LEDGERX_WEBHOOK_DISPATCHER_ENABLED: ${LEDGERX_WEBHOOK_DISPATCHER_ENABLED:-false}
      LEDGERX_WEBHOOK_ENCRYPTION_KEY: ${LEDGERX_WEBHOOK_ENCRYPTION_KEY:-}
      LEDGERX_WEBHOOK_ENCRYPTION_KEYS: ${LEDGERX_WEBHOOK_ENCRYPTION_KEYS:-}
      LEDGERX_WEBHOOK_ENCRYPTION_KEY_VERSION: ${LEDGERX_WEBHOOK_ENCRYPTION_KEY_VERSION:-1}
      LEDGERX_WEBHOOK_MAX_ENDPOINTS_PER_MERCHANT: ${LEDGERX_WEBHOOK_MAX_ENDPOINTS_PER_MERCHANT:-5}
      LEDGERX_WEBHOOK_MAX_ATTEMPTS: ${LEDGERX_WEBHOOK_MAX_ATTEMPTS:-8}
      LEDGERX_RECONCILIATION_ENABLED: ${LEDGERX_RECONCILIATION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - edge
      - data
      - events
      - monitoring

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      ledgerx:
        condition: service_healthy
    networks:
      - monitoring
      - monitoring-host

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ${LEDGERX_ALERTMANAGER_CONFIG:-./monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
      - notification-egress

  grafana:
    image: grafana/grafana:13.1.6
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ledgerx-operator}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
      - monitoring-host

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${KEYCLOAK_PUBLIC_DOMAIN}
      LEDGERX_WEB_ORIGIN: https://${LEDGERX_PUBLIC_DOMAIN}
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    networks:
      - edge
      - identity

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      LEDGERX_PUBLIC_DOMAIN: ${LEDGERX_PUBLIC_DOMAIN}
      KEYCLOAK_PUBLIC_DOMAIN: ${KEYCLOAK_PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      ledgerx:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

volumes:
  caddy-data:
  caddy-config:
  keycloak-postgres-data:
  ledgerx-postgres-data:
  kafka-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana-admin-password}

networks:
  edge:
  data:
    internal: true
  events:
    internal: true
  identity:
    internal: true
  monitoring:
    internal: true
  # Docker does not publish host ports from containers attached only to internal networks.
  # These UIs remain bound to 127.0.0.1 in their service port mappings.
  monitoring-host:
  notification-egress:
