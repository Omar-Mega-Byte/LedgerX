spring:
  application:
    name: ledgerx
  profiles:
    default: local
  flyway:
    default-schema: ledgerx
    schemas: ledgerx
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ledgerx

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
