spring:
  application:
    name: ledgerx
  profiles:
    default: local
  flyway:
    default-schema: ledgerx
    schemas: ledgerx
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ledgerx
  kafka:
    bootstrap-servers: ${LEDGERX_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ledgerx-payment-event-audit-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    try-it-out-enabled: true
    display-request-duration: true
    filter: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: list
    default-models-expand-depth: 1
    default-model-expand-depth: 2

ledgerx:
  kafka:
    payment-events-topic: ${LEDGERX_KAFKA_PAYMENT_EVENTS_TOPIC:ledgerx.payment-events.v1}
    consumer-enabled: ${LEDGERX_KAFKA_CONSUMER_ENABLED:false}
    event-retention: ${LEDGERX_KAFKA_EVENT_RETENTION:P14D}
    dead-letter-retention: ${LEDGERX_KAFKA_DEAD_LETTER_RETENTION:P30D}
  outbox:
    publisher-enabled: ${LEDGERX_OUTBOX_PUBLISHER_ENABLED:false}
    poll-delay: ${LEDGERX_OUTBOX_POLL_DELAY:PT5S}
    lease-duration: ${LEDGERX_OUTBOX_LEASE_DURATION:PT30S}
    publish-timeout: ${LEDGERX_OUTBOX_PUBLISH_TIMEOUT:PT10S}
    batch-size: ${LEDGERX_OUTBOX_BATCH_SIZE:20}
    retry-base-delay: ${LEDGERX_OUTBOX_RETRY_BASE_DELAY:PT1S}
    retry-max-delay: ${LEDGERX_OUTBOX_RETRY_MAX_DELAY:PT5M}
  webhooks:
    consumer-enabled: ${LEDGERX_WEBHOOK_CONSUMER_ENABLED:false}
    dispatcher-enabled: ${LEDGERX_WEBHOOK_DISPATCHER_ENABLED:false}
    consumer-group: ${LEDGERX_WEBHOOK_CONSUMER_GROUP:ledgerx-webhook-delivery-enqueuer-v1}
    encryption-key: ${LEDGERX_WEBHOOK_ENCRYPTION_KEY:}
    encryption-keys: ${LEDGERX_WEBHOOK_ENCRYPTION_KEYS:}
    encryption-key-version: ${LEDGERX_WEBHOOK_ENCRYPTION_KEY_VERSION:1}
    max-endpoints-per-merchant: ${LEDGERX_WEBHOOK_MAX_ENDPOINTS_PER_MERCHANT:5}
    batch-size: ${LEDGERX_WEBHOOK_BATCH_SIZE:20}
    poll-delay: ${LEDGERX_WEBHOOK_POLL_DELAY:PT5S}
    lease-duration: ${LEDGERX_WEBHOOK_LEASE_DURATION:PT30S}
    connect-timeout: ${LEDGERX_WEBHOOK_CONNECT_TIMEOUT:PT5S}
    request-timeout: ${LEDGERX_WEBHOOK_REQUEST_TIMEOUT:PT10S}
    retry-base-delay: ${LEDGERX_WEBHOOK_RETRY_BASE_DELAY:PT2S}
    retry-max-delay: ${LEDGERX_WEBHOOK_RETRY_MAX_DELAY:PT5M}
    max-attempts: ${LEDGERX_WEBHOOK_MAX_ATTEMPTS:8}
  reconciliation:
    enabled: ${LEDGERX_RECONCILIATION_ENABLED:false}
    cron: ${LEDGERX_RECONCILIATION_CRON:0 15 * * * *}
